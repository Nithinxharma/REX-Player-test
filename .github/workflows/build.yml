name: CI/CD Build

on:
  push:
    branches:
      - main
      - master
      - dev
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build Type (release, debug, all)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - release
          - debug

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build & Test Android APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Generate Short SHA & Commit Count
        id: git-info
        run: |
          echo "SHORT_SHA=$(git rev-parse --short HEAD 2>/dev/null || echo 'unknown')" >> $GITHUB_ENV
          echo "COMMIT_COUNT=$(git rev-list --count HEAD 2>/dev/null || echo '0')" >> $GITHUB_ENV

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue

      - name: Build Debug APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'all' }}
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'all' }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Upload Release APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'release' || inputs.build_type == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-Release-APKs-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn

      - name: Upload Debug APKs
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.build_type == 'debug' || inputs.build_type == 'all' }}
        uses: actions/upload-artifact@v4
        with:
          name: REX-Player-Debug-APKs-${{ env.SHORT_SHA }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn